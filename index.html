<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ToDo">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>ToDo</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </header>

    <nav class="filters" role="tablist" aria-label="表示切り替え">
      <button type="button" class="filter is-active" data-filter="all" role="tab" aria-selected="true">すべて</button>
      <button type="button" class="filter" data-filter="active" role="tab" aria-selected="false">未完了</button>
      <button type="button" class="filter" data-filter="done" role="tab" aria-selected="false">完了</button>
    </nav>

    <main class="content">
      <ul class="task-list" id="task-list" aria-label="タスク一覧"></ul>
      <p class="empty" id="empty" hidden></p>
      <button type="button" class="clear-done" id="clear-done" hidden>完了したタスクを削除</button>
    </main>

    <form class="add-form" id="add-form" autocomplete="off">
      <div class="add-context" id="add-context" hidden>
        <span class="add-context-label">サブタスクを追加：<strong id="add-context-title"></strong></span>
        <button type="button" class="add-context-clear" id="add-context-clear" aria-label="サブタスクの追加をやめる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <div class="add-row">
        <input
          type="text"
          id="add-input"
          class="add-input"
          placeholder="新しいタスクを入力"
          maxlength="200"
          enterkeyhint="done"
          aria-label="新しいタスク"
        >
        <button type="submit" class="add-button" id="add-button" aria-label="タスクを追加" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </form>
  </div>

  <dialog class="sheet" id="edit-dialog" aria-labelledby="edit-heading" tabindex="-1">
    <form method="dialog" id="edit-form" class="sheet-body" autocomplete="off">
      <div class="sheet-header">
        <button type="button" class="btn btn-plain" id="edit-cancel">キャンセル</button>
        <h2 id="edit-heading">タスクの詳細</h2>
        <button type="submit" class="btn btn-plain btn-strong" id="edit-save">保存</button>
      </div>

      <label class="field">
        <span class="field-label">タイトル</span>
        <textarea id="edit-title-input" class="field-input" rows="2" maxlength="200" required></textarea>
      </label>

      <label class="field">
        <span class="field-label">メモ</span>
        <textarea id="edit-note" class="field-input field-note" rows="5" maxlength="2000" placeholder="メモを入力（任意）"></textarea>
      </label>

      <label class="field">
        <span class="field-label">親タスク</span>
        <select id="edit-parent" class="field-input field-select"></select>
      </label>

      <div class="sheet-actions">
        <button type="button" class="btn btn-row" id="edit-add-sub">＋ サブタスクを追加</button>
        <button type="button" class="btn btn-row btn-danger" id="edit-delete">タスクを削除</button>
      </div>
    </form>
  </dialog>

  <div class="drop-indicator" id="drop-indicator" hidden></div>

  <script src="app.js"></script>
</body>
</html>
